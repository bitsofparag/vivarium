services:
  vivarium:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.13"
        NODE_MAJOR: "22"
        # Rootless Docker is the default. See README for the rootful override.
        USERNAME: root
        USER_UID: "0"
        USER_GID: "0"
        USER_HOME: /root
        INCLUDE_RUST: "${VIVARIUM_INCLUDE_RUST:-0}"
        INCLUDE_ZIG: "${VIVARIUM_INCLUDE_ZIG:-1}"
        INCLUDE_DOCS: "${VIVARIUM_INCLUDE_DOCS:-1}"
        INCLUDE_SEMGREP: "${VIVARIUM_INCLUDE_SEMGREP:-0}"
        INCLUDE_AGENTS: "${VIVARIUM_INCLUDE_AGENTS:-1}"
        INCLUDE_RTK: "${VIVARIUM_INCLUDE_RTK:-1}"
        INCLUDE_CODEGRAPH: "${VIVARIUM_INCLUDE_CODEGRAPH:-1}"
        INCLUDE_CAVEMAN: "${VIVARIUM_INCLUDE_CAVEMAN:-1}"
        RTK_VERSION: "${VIVARIUM_RTK_VERSION:-}"
        CODEGRAPH_VERSION: "${VIVARIUM_CODEGRAPH_VERSION:-}"
        CAVEMAN_REF: "${VIVARIUM_CAVEMAN_REF:-v1.9.1}"
    image: vivarium:latest
    init: false
    working_dir: /workspace
    stdin_open: true
    tty: true

    volumes:
      - type: bind
        source: ./workspace
        target: /workspace

      - vivarium-cache:/root/.cache
      - vivarium-go:/root/go
      - vivarium-state:/root/.local/state

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VIVARIUM_PROMPT: ${VIVARIUM_PROMPT:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-}

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g

volumes:
  vivarium-cache:
  vivarium-go:
  vivarium-state:
